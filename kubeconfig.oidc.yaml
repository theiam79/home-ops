---
# Secret-free kubeconfig: authenticates through Authelia OIDC via kubelogin.
# Safe to commit (the CA below is the public cluster CA cert). See talos/README.md "Kubernetes OIDC".
apiVersion: v1
kind: Config
clusters:
  - name: kubernetes
    cluster:
      server: https://192.168.100.5:6443
      certificate-authority-data: 
users:
  - name: oidc
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: kubelogin
        args:
          - get-token
          - --oidc-issuer-url=https://auth.tylerhundley.dev
          - --oidc-client-id=kubernetes
          - --oidc-pkce-method=S256
          - --oidc-extra-scope=offline_access
          - --oidc-extra-scope=profile
          - --oidc-extra-scope=email
          - --oidc-extra-scope=groups
        interactiveMode: IfAvailable
        provideClusterInfo: false
contexts:
  - name: oidc@kubernetes
    context:
      cluster: kubernetes
      user: oidc
      namespace: default
current-context: oidc@kubernetes
