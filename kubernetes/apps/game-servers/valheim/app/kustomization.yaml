---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./dnsendpoint.yaml
  - ./externalsecret.yaml
  - ./pvc.yaml
configMapGenerator:
  # BepInEx config overrides + the Odin post-install hook that applies them (README "Mod configs")
  - name: valheim-config
    files:
      - ./resources/10-config-overrides.sh
      - ./resources/blockchaaain.LetMeSleep.cfg
      - ./resources/advize.PlantEverything.cfg
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
