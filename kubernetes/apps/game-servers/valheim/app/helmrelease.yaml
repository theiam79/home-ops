---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valheim
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      valheim:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          terminationGracePeriodSeconds: 120
        containers:
          app:
            image:
              repository: ghcr.io/mbround18/valheim
              tag: 3.8.7
            env:
              TZ: America/Chicago
              NAME: Tired Old Vikings
              WORLD: TiredOldVikings
              PORT: &port "2456"
              PUBLIC: "0"
              # World tuning: see README for the full table
              MODIFIERS: resources=muchmore,deathpenalty=casual
              SET_KEY: playerevents
              # Mods: server-side set, pinned; friends' profile and configs in README "Mods"
              TYPE: BepInEx
              MODS: |
                ValheimModding-Jotunn-2.30.0
                RandyKnapp-AdvancedPortals-1.2.0
                Advize-PlantEverything-1.21.2
                Blockheim-LetMeSleep-1.0.5
              # Game updates are deliberate once modded (README "Updating with mods")
              UPDATE_ON_STARTUP: "0"
              AUTO_UPDATE: "0"
              AUTO_UPDATE_SCHEDULE: "0 5 * * *"
              AUTO_BACKUP_ON_UPDATE: "1"
              AUTO_BACKUP_REMOVE_OLD: "1"
              AUTO_BACKUP_DAYS_TO_LIVE: "7"
              HTTP_PORT: &status "3000"
            envFrom:
              - secretRef:
                  name: valheim-secret
            # Process probes: Huginn's /liveness stays 200 with the game dead (README "Gotchas")
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pgrep", "-f", "valheim_server.x86_64"]
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pgrep", "-f", "valheim_server.x86_64"]
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pgrep", "-f", "valheim_server.x86_64"]
                  periodSeconds: 30
                  failureThreshold: 2
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: "1"
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: valheim
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          external-dns.alpha.kubernetes.io/hostname: ${APP}.${SECRET_DOMAIN}
          lbipam.cilium.io/ips: 192.168.100.38
        ports:
          game:
            protocol: UDP
            port: *port
          query:
            protocol: UDP
            port: 2457
          rpc:
            protocol: UDP
            port: 2458
      status:
        controller: valheim
        ports:
          http:
            port: *status
    persistence:
      saves:
        existingClaim: ${APP}
        globalMounts:
          - path: /home/steam/.config/unity3d/IronGate/Valheim
            subPath: saves
          - path: /home/steam/backups
            subPath: backups
          # Mod configs ride the backed-up claim; edited in place (README "Mod configs")
          - path: /home/steam/valheim/BepInEx/config
            subPath: bepinex-config
      server:
        existingClaim: valheim-server-files
        globalMounts:
          - path: /home/steam/valheim
      tmp:
        # /home/steam is 750 owned by uid 111 in the image; uid 1000 needs its own writable dirs (README)
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /home/steam/.steam
            subPath: steam
          - path: /home/steam/.local
            subPath: local
          - path: /home/steam/.cache
            subPath: cache
          - path: /home/steam/Steam
            subPath: steamcmd-home
