## Managed in git: this file replaces the live one on every boot (README "Mod configs").
## Keys not listed here keep the mod's defaults; BepInEx fills them in on load.

[General]

## Fraction of online players that must be in bed to skip the night (0.01 to 1.0).
## 0.5 = half the group, 0.34 = a third.
ratio = 0.5

## Show a HUD message with the number of players currently in bed.
showMessage = true
