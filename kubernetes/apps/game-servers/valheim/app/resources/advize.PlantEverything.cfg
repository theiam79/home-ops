## Managed in git: this file replaces the live one on every boot (README "Mod configs").
## Keys not listed here keep the mod's defaults; BepInEx fills them in on load.
## Everything outside [General] is server-synced to clients; [General] is server-local.

[General]

## Only server admins may change synced settings from in-game Configuration Manager.
LockConfiguration = true

## Vanilla-balanced defaults otherwise. The author's own advice is to lower
## pickable respawn times (minutes); the defaults are 300 for berries and
## 240 for mushrooms, flowers and debris. Uncomment to tune:
# [Berries]
# RaspberryRespawnTime = 120
# BlueberryRespawnTime = 120
# CloudberryRespawnTime = 120
# [Mushrooms]
# MushroomRespawnTime = 90
# YellowMushroomRespawnTime = 90
# BlueMushroomRespawnTime = 90
# [Flowers]
# ThistleRespawnTime = 90
# DandelionRespawnTime = 90
