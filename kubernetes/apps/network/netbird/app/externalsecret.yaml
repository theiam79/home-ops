---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: netbird-secret
    template:
      data:
        # Whole server config lives here: see README ("Why the config is a secret")
        config.yaml: |
          server:
            listenAddress: ":8080"
            exposedAddress: "https://netbird.${SECRET_DOMAIN}:443"
            stunPorts:
              - 3478
            metricsPort: 9090
            healthcheckAddress: ":9000"
            logLevel: "info"
            logFile: "console"
            authSecret: "{{ .RELAY_SECRET }}"
            dataDir: "/var/lib/netbird/"
            disableAnonymousMetrics: true
            disableGeoliteUpdate: false
            auth:
              issuer: "https://netbird.${SECRET_DOMAIN}/oauth2"
              localAuthDisabled: false
              signKeyRefreshEnabled: true
              sessionCookieEncryptionKey: "{{ .SESSION_COOKIE_KEY }}"
              dashboardRedirectURIs:
                - "https://netbird.${SECRET_DOMAIN}/nb-auth"
                - "https://netbird.${SECRET_DOMAIN}/nb-silent-auth"
              cliRedirectURIs:
                - "http://localhost:53000/"
              dashboardPostLogoutRedirectURIs:
                - "https://netbird.${SECRET_DOMAIN}/"
            store:
              engine: "sqlite"
              encryptionKey: "{{ .DATASTORE_KEY }}"
            reverseProxy:
              trustedHTTPProxies:
                - "127.0.0.1/32"
  data:
    - secretKey: RELAY_SECRET
      remoteRef:
        key: "REPLACE-WITH-BWS-UUID-OF-NETBIRD_RELAY_SECRET"
    - secretKey: DATASTORE_KEY
      remoteRef:
        key: "REPLACE-WITH-BWS-UUID-OF-NETBIRD_DATASTORE_KEY"
    - secretKey: SESSION_COOKIE_KEY
      remoteRef:
        key: "REPLACE-WITH-BWS-UUID-OF-NETBIRD_SESSION_COOKIE_KEY"
