---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: unifi-secret
    template:
      data:
        MONGO_USER: unifi
        MONGO_PASS: "{{ .MONGO_PASS }}"
  data:
    # TODO(user): create a "unifi-mongo-pass" secret in Bitwarden Secrets
    # Manager and replace this UUID before merging
    - secretKey: MONGO_PASS
      remoteRef:
        key: "00000000-0000-0000-0000-000000000000"
