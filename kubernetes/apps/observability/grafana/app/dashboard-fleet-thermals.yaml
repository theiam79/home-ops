    {
      "uid": "fleet-thermals",
      "title": "Fleet Thermals",
      "tags": [
        "thermals",
        "node"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Hottest NVMe (composite)",
          "description": "Fleet-wide max right now. Warn 72\u00b0C, critical 76\u00b0C (drive rejects I/O above critical).",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#199e70",
                    "value": null
                  },
                  {
                    "color": "#c98500",
                    "value": 72
                  },
                  {
                    "color": "#e66767",
                    "value": 76
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "graphMode": "area",
            "colorMode": "value",
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "topk(1, node_hwmon_temp_celsius{chip=~\"nvme.*\", sensor=\"temp1\"} * on (instance) group_left (nodename) node_uname_info)",
              "legendFormat": "{{nodename}}"
            }
          ]
        },
