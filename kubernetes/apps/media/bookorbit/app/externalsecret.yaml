---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: bookorbit-secret
    template:
      data:
        JWT_SECRET: "{{ .JWT_SECRET }}"
        SETUP_BOOTSTRAP_TOKEN: "{{ .SETUP_BOOTSTRAP_TOKEN }}"
        BOOK_REQUEST_ENCRYPTION_KEY: "{{ .BOOK_REQUEST_ENCRYPTION_KEY }}"
        MIGRATION_ENCRYPTION_KEY: "{{ .MIGRATION_ENCRYPTION_KEY }}"
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: "REPLACE_WITH_BWS_UUID_BOOKORBIT_JWT_SECRET"
    - secretKey: SETUP_BOOTSTRAP_TOKEN
      remoteRef:
        key: "REPLACE_WITH_BWS_UUID_BOOKORBIT_SETUP_BOOTSTRAP_TOKEN"
    - secretKey: BOOK_REQUEST_ENCRYPTION_KEY
      remoteRef:
        key: "REPLACE_WITH_BWS_UUID_BOOKORBIT_BOOK_REQUEST_ENCRYPTION_KEY"
    - secretKey: MIGRATION_ENCRYPTION_KEY
      remoteRef:
        key: "REPLACE_WITH_BWS_UUID_BOOKORBIT_MIGRATION_ENCRYPTION_KEY"
