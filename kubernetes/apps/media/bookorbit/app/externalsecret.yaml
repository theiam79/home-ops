---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: bookorbit-secret
    template:
      data:
        JWT_SECRET: "{{ .JWT_SECRET }}"
        SETUP_BOOTSTRAP_TOKEN: "{{ .SETUP_BOOTSTRAP_TOKEN }}"
        BOOK_REQUEST_ENCRYPTION_KEY: "{{ .BOOK_REQUEST_ENCRYPTION_KEY }}"
        MIGRATION_ENCRYPTION_KEY: "{{ .MIGRATION_ENCRYPTION_KEY }}"
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: "30afaa5e-316b-48c8-a022-b4c0004308c1"
    - secretKey: SETUP_BOOTSTRAP_TOKEN
      remoteRef:
        key: "e40e44e5-e6be-4591-bd3a-b4c0004320da"
    - secretKey: BOOK_REQUEST_ENCRYPTION_KEY
      remoteRef:
        key: "c74d5e88-7689-49d0-a7c3-b4c000433a8f"
    - secretKey: MIGRATION_ENCRYPTION_KEY
      remoteRef:
        key: "baf246e9-c294-4d1b-a1e3-b4c000435258"
