---
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookorbit-pg
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 2
  # `standard` flavour bundles pgvector, which BookOrbit requires (see README)
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  storage:
    size: 10Gi
    storageClass: ceph-block
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
  # Recreate restores from the Garage backup (see README "Restore").
  bootstrap:
    recovery:
      source: bookorbit-pg-v1
      database: bookorbit
      owner: bookorbit
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: bookorbit-pg-backup
        serverName: bookorbit-pg-v1
  externalClusters:
    - name: bookorbit-pg-v1
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: bookorbit-pg-backup
          serverName: bookorbit-pg-v1
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: bookorbit-pg-backup
spec:
  retentionPolicy: "15d"
  configuration:
    destinationPath: "s3://cnpg/bookorbit/"
    endpointURL: "http://garage.internal:3900"
    s3Credentials:
      region:
        name: bookorbit-cnpg-secret
        key: AWS_REGION
      accessKeyId:
        name: bookorbit-cnpg-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: bookorbit-cnpg-secret
        key: AWS_SECRET_ACCESS_KEY
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: bookorbit-pg
spec:
  backupOwnerReference: self
  cluster:
    name: bookorbit-pg
  schedule: "0 0 2 * * *"
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
