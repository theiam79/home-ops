---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aurral
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      aurral:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/lklynet/aurral
              tag: 2.0.3
            env:
              TZ: America/Chicago
              PUID: "1000"
              PGID: "1000"
              AUTH_PROXY_ENABLED: "true"
              AUTH_PROXY_HEADER: remote-user
              AUTH_PROXY_ROLE_HEADER: remote-groups
              AUTH_PROXY_ADMIN_GROUPS: admins
              AUTH_PROXY_DOMAIN: "auth.${SECRET_DOMAIN}"
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: aurral
        ports:
          http:
            primary: true
            port: &port 3001
    route:
      app:
        hostnames:
          - "aurral.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: aurral
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: snotra.cluster
        path: /mnt/user/media
        globalMounts:
          - path: /data/media
      downloads:
        type: nfs
        server: snotra.cluster
        path: /mnt/disks/85AAZU6GS/cluster/downloads
        globalMounts:
          - path: /data/downloads
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
