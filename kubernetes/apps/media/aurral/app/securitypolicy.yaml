---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: aurral
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aurral
  extAuth:
    # An HTTP ext-authz service otherwise receives only Host, Method, Path,
    # Content-Length and Authorization — no cookie (Authelia could never see a
    # session) and no x-forwarded-proto (it built http:// redirect URLs).
    headersToExtAuth:
      - accept
      - cookie
      - proxy-authorization
      - x-forwarded-for
      - x-forwarded-host
      - x-forwarded-method
      - x-forwarded-proto
      - x-forwarded-uri
    http:
      backendRefs:
        - name: authelia
          namespace: auth
          port: 9091
      path: /api/authz/ext-authz
      headersToBackend:
        - Remote-User
        - Remote-Groups
        - Remote-Email
        - Remote-Name
