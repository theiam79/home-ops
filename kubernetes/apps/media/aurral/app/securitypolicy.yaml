---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: aurral
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aurral
  extAuth:
    # An HTTP ext-authz service otherwise receives only Host, Method, Path,
    # Content-Length and Authorization — no cookie (Authelia could never see a
    # session) and no x-forwarded-proto (it built http:// redirect URLs).
    headersToExtAuth:
      - accept
      - cookie
      - proxy-authorization
      - x-forwarded-for
      - x-forwarded-proto
    http:
      backendRefs:
        - name: authelia
          namespace: auth
          port: 9091
      # Trailing slash is required. Envoy Gateway concatenates the original
      # request path onto this one, and Authelia's ExtAuthz handler recovers the
      # original path from whatever follows the endpoint — so "/" must survive
      # as a leading slash. Without it, Authelia sees "settings/general" (no
      # leading slash) and 400s, and a bare "/" 301s to a bogus http:// URL.
      path: /api/authz/ext-authz/
      headersToBackend:
        - Remote-User
        - Remote-Groups
        - Remote-Email
        - Remote-Name
