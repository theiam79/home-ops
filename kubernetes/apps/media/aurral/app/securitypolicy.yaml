---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: aurral
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aurral
  extAuth:
    # An HTTP ext-authz service otherwise receives only Host, Method, Path,
    # Content-Length and Authorization — no cookie (Authelia could never see a
    # session) and no x-forwarded-proto (it built http:// redirect URLs).
    headersToExtAuth:
      - accept
      - cookie
      - proxy-authorization
      - x-forwarded-for
      - x-forwarded-host
      - x-forwarded-method
      - x-forwarded-proto
      - x-forwarded-uri
    http:
      backendRefs:
        - name: authelia
          namespace: auth
          port: 9091
      # pathOverride, not path: `path` APPENDS the original request path, so a
      # visit to "/" becomes "/api/authz/ext-authz/" and Authelia answers with a
      # trailing-slash 301 (built from the Host header and plain http) instead of
      # a portal redirect. Verified against Authelia directly:
      #   /api/authz/ext-authz/ -> 301 http://aurral.<domain>/api/authz/ext-authz
      #   /api/authz/ext-authz  -> 302 https://auth.<domain>/?rd=...  (correct)
      pathOverride: /api/authz/ext-authz
      headersToBackend:
        - Remote-User
        - Remote-Groups
        - Remote-Email
        - Remote-Name
