# Prusa Connect Local core config. Read once at start (reloader restarts the
# pod on change); unknown keys are refused at startup. See ../../README.md.
core:
  api:
    addr: ":8080"
  log:
    level: info
    format: json
  site: home
  # envoy pods, so X-Forwarded-For is honoured
  trusted_proxies:
    - 10.42.0.0/16
  # local accounts for the trial; Authelia OIDC replaces this later
  auth:
    local: true
  # mDNS cannot leave the pod network
  discovery:
    enabled: false
  # bundled first-party modules only: marketplace modules run unsandboxed
  marketplace:
    enabled: false
  modules_local:
    github.com/prusa3d/fleet-stats: /opt/modules/fleet-stats
    github.com/prusa3d/threemf: /opt/modules/threemf
    github.com/prusa3d/parts: /opt/modules/parts
    github.com/prusa3d/materials: /opt/modules/materials
  observability:
    enabled: true
    addr: ":9090"
resources:
  storage:
    local:
      type: filesystem
      enabled: true
      required: true
      config:
        root: /config/config.d/storage
