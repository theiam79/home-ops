---
# The whole core config lives here because core.auth.client_secret is a plain
# value in config.yaml (the core reads no env vars). Read once at start;
# reloader restarts the pod on change; unknown keys fail startup. See ../README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prusa-connect
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: prusa-connect-config
    template:
      data:
        config.yaml: |
          core:
            api:
              addr: ":8080"
            log:
              level: info
              format: json
            site: home
            # envoy pods, so X-Forwarded-For is honoured
            trusted_proxies:
              - 10.42.0.0/16
            # admin = theiam79's Authelia opaque subject (sector "")
            principal: 7c55075a-f26f-4411-8309-8c77f67c9f80
            auth:
              issuer: https://auth.${SECRET_DOMAIN}
              client_id: prusa-connect
              client_secret: "{{ .PRUSA_CONNECT_CLIENT_SECRET }}"
              redirect_uri: https://prusa.${SECRET_DOMAIN}/api/v1/auth/callback
              provider_name: Authelia
            # mDNS cannot leave the pod network
            discovery:
              enabled: false
            # bundled first-party modules only: marketplace modules run unsandboxed
            marketplace:
              enabled: false
            modules_local:
              github.com/prusa3d/fleet-stats: /opt/modules/fleet-stats
              github.com/prusa3d/threemf: /opt/modules/threemf
              github.com/prusa3d/parts: /opt/modules/parts
              github.com/prusa3d/materials: /opt/modules/materials
            # no core.observability: the published image is built without the
            # metrics client and refuses to start with it enabled (0.1.0-beta.1)
          resources:
            storage:
              local:
                type: filesystem
                enabled: true
                required: true
                config:
                  root: /config/config.d/storage
  data:
    - secretKey: PRUSA_CONNECT_CLIENT_SECRET
      remoteRef:
        key: "b27610b7-2fbb-4c54-b3ba-b506007473ed"
