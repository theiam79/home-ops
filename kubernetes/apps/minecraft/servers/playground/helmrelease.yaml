---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}-mc
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: minecraft
  values:
    resources:
      requests:
        cpu: 512m
        memory:  1000Mi
    workloadAsStatefulSet: true
    strategyType: RollingUpdate
    serviceAnnotations:
      mc-router.itzg.me/externalServerName: ${APP}.mc.${SECRET_DOMAIN}
      reloader.stakater.com/auto: "true"
    minecraftServer:
      eula: "TRUE"
      type: "FABRIC"
      # renovate: datasource=custom.modrinth-game-versions packageName=bluemap
      version: "26.2"
      difficulty: normal
      forcegameMode: true
      gameMode: creative
      memory: ""
      whitelist: ${WHITELIST}
      ops: ${OPS}
      modrinth:
        projects:
          - fabric-api
          - chunky
          - bluemap
      extraPorts:
        - name: map
          containerPort: 8100
          protocol: TCP
          service:
            enabled: true
            type: ClusterIP
            port: 8100
    extraEnv:
      EXISTING_OPS_FILE: SKIP
      EXISTING_WHITELIST_FILE: SKIP
    persistence:
      dataDir:
        enabled: true
        existingClaim: ${APP}
    # bluemap regenerates these as current-format defaults each start; custom settings belong in the bluemap-config configmap (see servers/README.md)
    initContainers:
      - name: bluemap-config-reset
        image: busybox:stable
        command:
          - sh
          - -c
          - >-
            rm -rf
            /data/config/bluemap/maps
            /data/config/bluemap/plugin.conf
            /data/config/bluemap/webapp.conf
            /data/config/bluemap/webserver.conf
            /data/bluemap/web/index.html
        volumeMounts:
          - name: datadir
            mountPath: /data
    extraVolumes:
      - volumeMounts:
          - name: bluemap-config
            mountPath: /data/config/bluemap/core.conf
            subPath: core.conf
        volumes:
          - name: bluemap-config
            configMap:
              name: bluemap-config
    extraDeploy:
      - |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: bluemap-config # Will be prefixed
        data:
          core.conf: |
            accept-download: true
            data: "/data/bluemap/web"
            render-thread-count: 2