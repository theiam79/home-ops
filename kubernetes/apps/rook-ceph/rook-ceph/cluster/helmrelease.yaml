---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph-cluster
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.20.7
  url: oci://ghcr.io/rook/rook-ceph-cluster
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  driftDetection:
    mode: enabled
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  postRenderers:
    # Strip CephNodeInconsistentMTU — upstream rule's scalar(max by(device)…)
    # comparison fires false-positives on our cluster (heterogeneous NIC layouts
    # across nodes). `test` ops fail loudly if Rook reorders rules so we re-pin.
    - kustomize:
        patches:
          - target:
              kind: PrometheusRule
              name: prometheus-ceph-rules
            patch: |
              - op: test
                path: /spec/groups/6/name
                value: nodes
              - op: test
                path: /spec/groups/6/rules/5/alert
                value: CephNodeInconsistentMTU
              - op: remove
                path: /spec/groups/6/rules/5
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    # Explicit Ceph pin (matches the 1.20.6 chart default) so version moves are
    # deliberate; Renovate is gated to stable x.2.z builds. Squid→Tentacle and
    # later majors are maintenance-window merges.
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.4
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          # device_failure_prediction_mode: local # requires mgr module
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      mgr:
        modules:
          # - name: diskprediction_local
          #   enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          # No `rook` orchestrator module: Rook force-disables it on Ceph 20.2.2-20.2.4
          # (mgr crash), and it is not needed for an RBD-only cluster.
      network:
        provider: host
        connections:
          requireMsgr2: true
        addressRanges:
          cluster:
            - "10.10.10.0/24"
      placement:
        # Mons only on nodes whose system disk is an enterprise (PLP) SSD —
        # the mon store lives on the node's /var. Label is set in talos/nodes.
        mon:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: system-disk
                      operator: In
                      values:
                        - enterprise
      security:
        cephx:
          # Step 3 of the aes256k migration (2026-09-09): every key is aes256k
          # (ceph auth dump-keys shows 0 aes), so retire the aes cipher at the
          # mons. Sets auth_allowed_ciphers; clears AUTH_INSECURE_KEYS_ALLOWED
          # and AUTH_INSECURE_KEYS_CREATABLE. Recovery if a daemon key is ever
          # aes again: allowedCiphers [aes, aes256k] + daemon.keyType aes (README).
          allowedCiphers:
            - aes256k
          # CVE-2025-30156 remediation: rotate daemon keys to the aes256k type
          # introduced in Ceph 19.2.6. Expect ~90min of benign HEALTH_ERR while
          # daemons restart with new keys (blocks dependent Kustomizations only).
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          # CSI + rbd-mirror-peer keys: aes256k needs kernel support for RBD
          # mounts — Talos v1.13.10 backported it into 6.18.48 (rolled 09-09),
          # and Rook 1.20.7 ships CSI 3.17.1 (required). keepPriorKeyCountMax
          # keeps the old aes key alive for already-mounted PVCs; new mounts use
          # aes256k. Migration runbook + the allowedCiphers follow-up: ../README.md
          # keepPriorKeyCountMax 0: every RBD mapping was rehydrated onto the
          # generation-2 key on 2026-09-09 (71/71 verified via /sys/bus/rbd).
          csi:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keepPriorKeyCountMax: 0
            keyType: aes256k
          rbdMirrorPeer:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keyType: aes256k
      storage:
        useAllNodes: true
        useAllDevices: false
        devicePathFilter: /dev/disk/by-id/ata-SAMSUNG_MZ7L3960HCJR-00A07.*
        config:
          osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    # NOTE: After disabling the filesystem, the filesystem can be removed with the following commands:
    # ceph fs fail ceph-filesystem && ceph fs rm ceph-filesystem --yes-i-really-mean-it
    cephFileSystems: []
    cephObjectStores: []