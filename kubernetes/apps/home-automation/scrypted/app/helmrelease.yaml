---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrypted
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      scrypted:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/koush/scrypted
              tag: v0.144.3-noble-full
            env:
              TZ: America/Chicago
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &httpPort 11080
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        # Scrypted's image expects to run as root: it self-updates the server
        # (npm installs into /server/volume) and its plugins bind low resources.
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: scrypted
        ports:
          http:
            primary: true
            port: *httpPort
          rtsp:
            # Fixed RTSP rebroadcast port. Set the doorbell's "Rebroadcast Port"
            # to this value in the Scrypted UI so Frigate has a stable URL.
            port: 8554
    route:
      app:
        hostnames:
          - "scrypted.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      config:
        existingClaim: scrypted
        globalMounts:
          - path: /server/volume
